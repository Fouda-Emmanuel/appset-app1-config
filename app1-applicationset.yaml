apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app1-multi-region
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
  - list:
      elements:
      - region: nvirginia
        destinationName: in-cluster
        namespace: app1-nvirginia-ns
      - region: central
        destinationName: thugger@cluster-central.ca-central-1.eksctl.io
        namespace: app1-central-ns

  template:
    metadata:
      name: "app1-{{.region}}"
    spec:
      project: default

      source:
        repoURL: https://github.com/Fouda-Emmanuel/appset-app1-config.git
        targetRevision: main
        path: "{{.region}}/manifests"

      destination:
        name: "{{.destinationName}}"
        namespace: "{{.namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true